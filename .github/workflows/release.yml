name: Release

# リリースは main の package.json の version で決まる。まだリリースされておらず、
# 公開中の最新より新しい version を main に載せればリリースされ、リリース済みの
# version のままなら何度 push しても何も起きない。ローカルからは
# `pnpm release [patch|minor|major]` (scripts/release.sh) で採番して push する。
# PR の中で version を上げてマージしても同じようにリリースされる。
#
# 実行可否を決めるのは diff ではなく「その version がリリース済みか」。squash / rebase /
# 直 push で diff は変わるが結果は変わらない (冪等)。path フィルターを付けないのも
# 同じ理由で、bump が想定外の形で入っても取りこぼさないため。
on:
  push:
    branches: [main]
  # PR では test ジョブだけが走る (plan 以降は if で止めてある)。門番のテストを
  # マージ前に同じ定義で回すためで、リリース経路とテストの内容がずれない。
  pull_request:
  # version は正しいのに、その時の run が (API の一時障害等で) 失敗した場合の再実行用。
  # 同じ判定を通るので、公開済みの version をもう一度出すことはできない。
  workflow_dispatch:

# 既定は権限なし。必要な job にだけ与える。特に test は PR が持ち込んだコードを
# 実行するので contents: read までしか渡さない (同一リポジトリからの PR では
# GITHUB_TOKEN が write を持ちうるため、ここを既定に任せない)。
#
# public リポジトリの fork からの pull_request では、permissions の記述に関わらず
# GITHUB_TOKEN が read-only に切り下げられ secrets も渡らない。同一リポジトリの
# ブランチから PR を出せるのは既に write 権限を持つ相手だけなので、PR で workflow を
# 書き換えても権限の昇格にはならない。
permissions: {}

# 同時に走らないよう直列化する。run 単位で直列なので、後続の run の plan は先行 run の
# publish が終わってから走り、同じ version を二重にビルドしない。ただし pending の
# 消化順は push 順とは限らない (GitHub は開始順を保証しない)。新しい version が先に
# 公開された後で古い version の run が回ってきても、plan が「最新より古い」で止める。
# run を取りこぼすと、その version は次に main へ push (または dispatch) されるまで
# 公開されない。取りこぼさないために 2 つとも要る:
#   cancel-in-progress: false — 走行中の run を後発でキャンセルしない。
#   queue: max — pending も最大 100 件まで積む。既定の `queue: single` は pending を
#     1 件しか保持せず、新しい run が既存 pending を置き換える。
# (queue: max と cancel-in-progress: true の併用は validation error になる)
#
# PR の検査 run はリリースの直列化とは無関係なので、リリース用のグループへ入れない
# (同じグループにすると PR が走るだけでリリースが pending に積まれる)。commit ごとに
# 別グループにして、同じ PR への連続 push が順番待ちを作らないようにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.sha) || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  # 署名・公証に macOS ランナーを使う前に、その version がまだリリースされておらず、
  # 公開中の最新より新しいことを確かめる。ここが false を返す限り、main への push の
  # たびに macOS ランナーが動くことはない。
  # PR ではリリース判定そのものが無意味なので走らせない。この job が skipped に
  # なると、依存している build / publish も (always() を使っていないので) skipped に
  # なる — PR では test だけが動く。
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      # dispatch は自分の ref を指定できる。未公開 version を載せたブランチが、
      # そのブランチの内容でリリースされてしまわないようにする (push では main 以外
      # 起こり得ないが、dispatch では起こる)。
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::releases come from main, and this run is on ${REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 判定の中身は scripts/release-decide.sh。publish が公開直前にも同じ判定を使う。
      # `release=$(...)` を代入で受けるのは、スクリプトの失敗 (判定不能) で step を
      # 落とすため (echo の引数の中でコマンド置換が失敗しても -e は効かない)。
      - name: Decide whether this version still needs releasing
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release=$(bash scripts/release-decide.sh)
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # リリースビルドの門番。方針: cyberneura/cyberneura-github-actions の
  # docs/build-requires-tests.md
  #
  # runs-on を build と同じ macOS にしてあるのは方針のルール 4 による (配布物は
  # macOS 向けにしか作らないので、検査もその OS で行う)。
  test:
    # push / dispatch では、実際にリリースする version の時だけ走らせる。plan を
    # 通さず無条件に走らせると、リリースを伴わない main への push のたびに
    # macOS ランナーが動く — plan を置いた目的そのものが無くなる。
    # PR では plan が skipped になり、既定ではこの job も道連れで skipped になる
    # ので、!cancelled() で自動スキップを外してからイベント名で判定する
    # (plan が失敗した時は needs.plan.result で止まる)。
    needs: plan
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'pull_request'
              || (needs.plan.result == 'success'
                  && needs.plan.outputs.release == 'true')) }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # `version` を渡さない理由は build ジョブの同じステップを参照。
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check && pnpm test

  # macOS 専用アプリなので macOS のみビルドする。Intel / Apple Silicon 両対応の
  # universal dmg を配布する (package.json の build.mac.target で指定済み)。
  build:
    # test を通らずにビルドしない。needs は同じ run の job にしか効かないので、
    # テストを別 workflow に切り出さないこと。
    needs: [plan, test]
    # PR では成果物を作らない (Apple の証明書を PR のコードに触らせないためでもある)。
    # PR では plan が skipped なので下の判定だけでも止まるが、証明書を扱う job なので
    # イベント名でも明示的に止める。
    if: github.event_name != 'pull_request' && needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    # GitHub Release の作成とアセットアップロードに contents: write が必要。
    permissions:
      contents: write
    # universal ビルドは両アーキの Electron を落としてから結合するうえ、Apple の
    # 公証サービスの待ち時間が読めない。ハングした時の上限であって通常はここまで
    # 使わない。
    timeout-minutes: 60

    steps:
      # persist-credentials: false — checkout が write 権限の GITHUB_TOKEN を
      # .git/config に残さないようにする。以降のステップ (pnpm install の
      # install script や third-party action) がそれを拾えないようにするため。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # `version` は渡さない。この action は package.json の `packageManager`
      # (pnpm@10.26.0) と `version` の**文字列が一致しない**と
      # "Multiple versions of pnpm specified" で落ちるので、"10" と書くと
      # 依存関係のインストールまで到達しない。他のリポジトリ (flashcap 等) が
      # `version: 10` で通っているのは packageManager フィールドが無いから。
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Secret が欠けていても electron-builder は「失敗」ではなく**黙って未署名の
      # 成果物を作る** (CSC_LINK が無ければ署名を飛ばし、公証の env が無ければ
      # 公証も行わない)。未署名・未公証の dmg は cask から入れても Gatekeeper に
      # 起動を止められるので、ここで先に落とす。
      - name: Verify signing secrets are present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Signing and notarization would be silently skipped."
            exit 1
          fi
          echo "All signing and notarization secrets are present."

      # 公開済みバージョンに上書きしてしまう事故を防ぐ。plan が公開済みの version を
      # 止めるので、ここで引っかかるのは plan の後に誰かが公開した場合と、下の
      # タグ / draft の残骸。
      #
      # 404 だけを「存在しない」と読む。`gh release view` の非ゼロ終了をまとめて
      # 「無い」と扱うと、認証切れや rate limit を version の空きと誤認し、時間のかかる
      # 署名と公証を済ませた後の draft 作成まで失敗を先送りしてしまう。
      - name: Verify the release does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if out=$(gh api "repos/${REPO}/releases/tags/v${VERSION}" 2>&1); then
            echo "::error::Release v${VERSION} already exists. Bump the version (pnpm release) instead of re-running this workflow."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q "HTTP 404"; then
            echo "::error::Could not determine whether v${VERSION} exists: ${out}"
            exit 1
          fi
          # タグ単体が先に存在していないことも見る。GitHub は **タグが既にあると
          # target_commitish を黙って無視する**ので、Release 側で target を指定しても
          # 「古いタグが指す別の commit のまま公開される」のを防げない。失敗した run が
          # 残したタグや手で打ったタグがここに引っかかる。
          if tag=$(gh api "repos/${REPO}/git/ref/tags/v${VERSION}" 2>&1); then
            echo "::error::Tag v${VERSION} already exists without a release. Delete it or bump the version."
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -q "HTTP 404"; then
            echo "::error::Could not determine whether tag v${VERSION} exists: ${tag}"
            exit 1
          fi
          # draft はタグを持たないので、上の 2 つのどちらにも引っかからない。失敗した
          # run が残した draft を再利用すると、前回の中途半端なアセットを今回の成果物と
          # 一緒に公開しかねない。この workflow は draft を再利用せず、毎回 1 つだけ作る。
          if draft=$(gh release view "v${VERSION}" --json isDraft 2>&1); then
            echo "::error::A draft release v${VERSION} is left over. Delete it (gh release delete v${VERSION}) or bump the version."
            exit 1
          fi
          if ! printf '%s' "$draft" | grep -q "release not found"; then
            echo "::error::Could not determine whether a draft v${VERSION} exists: ${draft}"
            exit 1
          fi
          echo "v${VERSION} is free."

      # electron-builder は証明書を自分で keychain へインポートする。Tauri と違い
      # `security create-keychain` を手で書く必要はなく、CSC_LINK に base64 の p12 を
      # 渡すだけでよい。secrets 名は他リポジトリ (Tauri 側) と揃えてあるので、
      # ここで electron-builder が読む名前に写す。
      #
      # 公証は APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID を見る
      # (package.json の mac.notarize: true)。APPLE_PASSWORD は app 用パスワード
      # なので、そのまま APPLE_APP_SPECIFIC_PASSWORD に渡す。
      #
      # electron-builder の GitHub publisher は DMG と blockmap を並列処理し、Release が
      # 無い状態では両方が別々の draft を作る競合がある。ここでは build だけを行い、
      # 検証後に gh CLI で draft を 1 つ作って DMG だけをアップロードする。
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm dist --publish never

      # 署名も公証も、失敗ではなく「静かに省略」で終わることがある。成果物を
      # 直接検査して、そうなっていないことを確かめる。spctl は Gatekeeper が
      # 実際に下す判断そのものなので、cask から入れた利用者と同じ経路を見ている。
      - name: Verify the signature and the notarization ticket
        run: |
          APP="dist/mac-universal/Mullion.app"
          if [ ! -d "$APP" ]; then
            APP=$(find dist -maxdepth 2 -name "Mullion.app" -type d | head -1)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::Built app not found under dist/."
            exit 1
          fi
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application" || {
            echo "::error::The app is not signed with a Developer ID Application certificate."
            exit 1
          }
          # `--verbose` を付けないと spctl は成功時に**何も出力しない** (exit 0 のみ)
          # ので、出力を grep する判定は verbose の出力に対して行う。判断そのものは
          # 終了コードで、内訳は source 行で見る。
          #
          # 通っただけでは足りない。ad-hoc 署名でも別の経路で accepted になることが
          # あり、cask から入れた利用者に効くのは公証まで済んで staple された状態
          # ("source=Notarized Developer ID") だけ。ここが "Unnotarized Developer ID"
          # のまま公開すると、ダウンロードしたアプリは quarantine で起動できない。
          ASSESS=$(spctl --assess --type execute --verbose=4 "$APP" 2>&1) || {
            echo "::error::Gatekeeper rejected the app: ${ASSESS}"
            exit 1
          }
          echo "$ASSESS"
          printf '%s' "$ASSESS" | grep -q "source=Notarized Developer ID" || {
            echo "::error::Accepted, but not as a notarized Developer ID app: ${ASSESS}"
            exit 1
          }
          xcrun stapler validate "$APP"

      # 署名を確かめたのはローカルの成果物で、利用者が受け取るのは Release の
      # アセット。その2つが同じものだと確かめるまで、検証は終わっていない。
      # `gh release upload` の成功だけでなく、同じ名前のアセットを GitHub から
      # ダウンロードして hash を比較し、利用者が受け取る DMG がこの build の成果物
      # そのものだと確認する。
      #
      # ファイル名も突き合わせる。cask の url は artifactName が決めた名前を
      # 直書きしているので、名前が変われば公開済みの全バージョンの
      # `brew install` が壊れる。
      - name: Upload and verify the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="mullion-${VERSION}-universal.dmg"
          if [ ! -f "dist/${NAME}" ]; then
            echo "::error::Expected dist/${NAME}. Did build.artifactName change? The cask url depends on this name."
            ls -la dist || true
            exit 1
          fi
          gh release create "v${VERSION}" --draft --title "${VERSION}"
          IS_DRAFT=$(gh release view "v${VERSION}" --json isDraft -q .isDraft)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::v${VERSION} is not a draft. Refusing to continue."
            exit 1
          fi
          gh release upload "v${VERSION}" "dist/${NAME}" --clobber
          gh release download "v${VERSION}" --pattern "$NAME" --dir "$RUNNER_TEMP/verify" --clobber
          LOCAL=$(shasum -a 256 "dist/${NAME}" | cut -d' ' -f1)
          REMOTE=$(shasum -a 256 "$RUNNER_TEMP/verify/${NAME}" | cut -d' ' -f1)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::The uploaded asset does not match the local build (${LOCAL} != ${REMOTE})."
            exit 1
          fi
          echo "Release asset verified: ${NAME} ${LOCAL}"

  # ビルド・署名・公証・アップロードがすべて成功した時のみ draft を公開する。
  # 失敗した場合は draft のまま残る (不完全な Release は公開されない)。
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # タグは**このビルドの commit** に、公開の前に自分で打つ。放っておくと打たれる
      # のは「公開した瞬間の default branch の先端」で、ビルド中に次の bump が main に
      # 載れば v0.1.1 のタグが v0.1.2 の commit を指す (concurrency が直列化するのは
      # run であって push ではない)。draft の作成時には tag ref がまだ無く、
      # `gh release edit --target` はタグが既にあると無視されるうえ、`--draft=false` は
      # その場で公開してしまうので、そこで気づいてももう取り消せない。先に打てば、
      # 間違ったタグで公開されること自体が起きない。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # 公開直前に plan と同じ判定をやり直す。「Re-run failed jobs」は成功済みの
          # plan を再実行せず当時の release=true を使い回すので、その間に新しい version が
          # 公開されていると --latest で最新を巻き戻してしまう。止めた場合 draft は残る。
          # タグを打つより前に判定する (打ってから止めるとタグだけが残る)。
          release=$(VERSION="$VERSION" GH_REPO="$REPO" bash scripts/release-decide.sh)
          if [ "$release" != "true" ]; then
            echo "::error::v${VERSION} should no longer be published (see the message above); leaving the draft as it is."
            exit 1
          fi
          # タグは公開の前に、こちらから打つ。`--target` に任せると「タグがまだ無い」
          # ときにしか効かず、効かなかったことに気づけるのは公開した後になる
          # (`--draft=false` はその場で公開してしまうので、後段の照合は誤りを
          # 見つけられても取り消せない)。先に打っておけば、間違ったタグで公開される
          # ことはそもそも起こらない。
          if out=$(gh api "repos/${REPO}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="$SHA" 2>&1); then
            echo "Tagged v${VERSION} at ${SHA}"
          else
            if ! printf '%s' "$out" | grep -q "already exists"; then
              echo "::error::Could not create tag v${VERSION}: ${out}"
              exit 1
            fi
            # preflight の後に誰かが打ったタグ。指す先が同じなら続行してよい。
            EXISTING=$(gh api "repos/${REPO}/git/ref/tags/v${VERSION}" -q .object.sha)
            if [ "$EXISTING" != "$SHA" ]; then
              echo "::error::Tag v${VERSION} already exists at ${EXISTING}, not at the built commit ${SHA}. Not publishing."
              exit 1
            fi
            echo "Tag v${VERSION} already existed at ${SHA}"
          fi
          gh release edit "v${VERSION}" --draft=false --latest
          TAG_SHA=$(gh api "repos/${REPO}/git/ref/tags/v${VERSION}" -q .object.sha)
          if [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::Tag v${VERSION} points at ${TAG_SHA}, not at the built commit ${SHA}."
            exit 1
          fi
          echo "Published: $(gh release view "v${VERSION}" --json url -q .url) (tag at ${TAG_SHA})"
